<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block titulo %}Fulbacho{% endblock %}</title>
  <style>
    /* ===== Estilos comunes a TODAS las páginas ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: sans-serif;
      min-height: 100vh;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
    }

    .topbar {
      background: #264653;
      color: white;
      height: 60px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .topbar img { height: 36px; object-fit: contain; }

    .footer {
      background: #264653;
      color: white;
      height: 50px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    /* ===== Estilos propios de cada página ===== */
    {% block estilos %}{% endblock %}
  </style>
</head>
<body>

  <div class="topbar">{% block topbar %}Fulbacho{% endblock %}</div>

  {% block contenido %}{% endblock %}

  <div class="footer">Fulbacho &copy; 2026</div>

  {% block scripts %}{% endblock %}

</body>
</html>
